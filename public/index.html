<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secret Santa</title>
<meta name="description" content="Draw names for a gift exchange. Everyone gets a private link with their match and wish list.">
<meta name="theme-color" content="#14382b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Secret Santa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1e7; --card: #fffdf8; --ink: #1d2a24; --muted: #6b746e; --line: #e3dccd;
    --green: #14382b; --red: #b3262f; --gold: #c99a3b; --soft: #eef4ef;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Inter, system-ui, sans-serif; }
  header { position: relative; background: var(--green); color: #fff; padding: calc(48px + env(safe-area-inset-top)) 16px 64px; text-align: center;
    background-image: radial-gradient(circle at 20% 30%, #ffffff14 2px, transparent 3px), radial-gradient(circle at 70% 60%, #ffffff10 2px, transparent 3px);
    background-size: 46px 46px, 61px 61px; }
  header h1 { font: 800 clamp(30px, 7vw, 44px)/1.1 Fraunces, Georgia, serif; margin: 0; letter-spacing: -.5px; }
  header h1 a { color: inherit; text-decoration: none; }
  .acct { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px; color: #fff; font-size: 14px; font-weight: 600; text-decoration: none; padding: 6px 12px; border: 1px solid #ffffff40; border-radius: 999px; }
  header p { margin: 8px 0 0; opacity: .8; }
  main { position: relative; max-width: 640px; margin: -40px auto 40px; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-bottom: 16px; box-shadow: 0 2px 10px #14382b0d; }
  h2 { font: 600 22px/1.2 Fraunces, Georgia, serif; margin: 0 0 12px; color: var(--green); }
  h3 { font-size: 15px; margin: 18px 0 8px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
  input, textarea, select { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--gold); border-color: transparent; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .row > input, .row > select { flex: 1; min-width: 0; }
  .check { display: flex; align-items: center; gap: 4px; margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; cursor: pointer; }
  .check input { width: auto; margin: 0; accent-color: var(--red); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  button { font: 600 15px Inter, sans-serif; border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer; background: var(--red); color: #fff; }
  button.ghost { background: transparent; color: var(--green); border: 1px solid var(--line); }
  button.x { background: transparent; color: var(--muted); padding: 8px 10px; font-size: 18px; line-height: 1; }
  button:disabled { opacity: .5; cursor: default; }
  .big { width: 100%; padding: 14px; font-size: 17px; margin-top: 18px; }
  .muted { color: var(--muted); font-size: 14px; }
  .err { color: var(--red); font-weight: 600; min-height: 1.5em; margin: 8px 0 0; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 0; padding: 0; list-style: none; }
  .facts li { background: var(--soft); color: var(--green); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 600; }
  .reveal { text-align: center; padding: 30px 22px; }
  .reveal .tag { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); }
  .reveal .name { font: 800 clamp(34px, 9vw, 52px)/1.1 Fraunces, Georgia, serif; color: var(--red); margin: 8px 0; }
  .gift { width: 140px; height: 140px; margin: 10px auto 14px; cursor: pointer; transition: transform .2s; }
  .gift:hover { transform: rotate(-3deg) scale(1.04); }
  .gift.open .lid { transform: translate(0, -26px) rotate(-14deg); }
  .lid { transition: transform .4s; transform-origin: 30px 40px; }
  .wish { white-space: pre-wrap; background: var(--soft); border-radius: 10px; padding: 12px 14px; margin: 0; }
  .wish a { color: var(--green); word-break: break-all; }
  .people { list-style: none; margin: 0; padding: 0; }
  .people li { display: flex; align-items: center; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
  .people li:first-child { border-top: 0; }
  .people .who { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
  .reveal .facts { justify-content: center; }
  .people .who small { display: block; font-weight: 400; color: var(--muted); }
  .people button { padding: 8px 12px; font-size: 14px; }
  .msgs { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
  .msg { max-width: 82%; padding: 8px 12px; border-radius: 14px; background: var(--soft); align-self: flex-start; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.mine { align-self: flex-end; background: var(--green); color: #fff; }
  .steps { margin: 0; padding-left: 20px; }
  .steps li { margin: 4px 0; }
  /* Bottom tab bar, like a phone app. */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -4px 14px #14382b14; padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); }
  .tabs button { position: relative; flex: 1; max-width: 140px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: 11px; background: transparent; color: var(--muted); border-radius: 10px; white-space: nowrap; }
  .tabs .i { font-size: 22px; line-height: 1; filter: grayscale(1); opacity: .6; }
  .tabs button.on { color: var(--red); }
  .tabs button.on .i { filter: none; opacity: 1; }
  body:has(.tabs) main { padding-bottom: 80px; }
  body:has(.tabs) header { padding: calc(44px + env(safe-area-inset-top)) 16px 56px; }
  body:has(.tabs) footer { display: none; }
  body:has(.tabs) .toast { bottom: calc(84px + env(safe-area-inset-bottom)); }
  .badge { position: absolute; top: 2px; left: calc(50% + 8px); min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; line-height: 18px; }
  /* Wish lists: a grid of picture cards. */
  .items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (min-width: 560px) { .items { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .item { display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
  .pic { aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #fff; display: grid; place-items: center; font-size: 40px; text-decoration: none; }
  .pic img { width: 100%; height: 100%; object-fit: contain; }
  .info { flex: 1; min-width: 0; }
  .info .t { font-size: 14px; line-height: 1.35; font-weight: 600; color: var(--ink); text-decoration: none; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  a.t:hover { text-decoration: underline; }
  .price { font-weight: 700; font-size: 17px; margin-top: 4px; }
  .info .note { font-size: 13px; margin-top: 4px; padding: 4px 8px; border-radius: 8px; background: var(--soft); overflow-wrap: anywhere; }
  .buy, .item .add { display: block; text-align: center; padding: 8px; font: 600 13px Inter, sans-serif; border-radius: 999px; background: #ffd814; color: #111; text-decoration: none; border: 0; }
  .item .add:disabled { background: var(--soft); color: var(--green); opacity: 1; }
  .acts { display: flex; gap: 6px; }
  .acts button { flex: 1; padding: 6px 8px; font-size: 13px; }
  .acts button:first-child { flex: 0 0 auto; }
  .search { display: flex; gap: 8px; margin-bottom: 12px; }
  .search input { flex: 1; min-width: 0; }
  .search button { padding: 10px 14px; }
  .more { display: inline-block; margin-top: 12px; color: var(--green); font-weight: 600; }
  details summary { cursor: pointer; font-weight: 600; color: var(--green); }
  .count { font: 600 14px Inter, sans-serif; background: var(--soft); border-radius: 999px; padding: 2px 10px; vertical-align: middle; }
  /* Everyone: pick a person, see their list. */
  .who { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 12px; margin: 0 -2px; scrollbar-width: none; }
  .who button { flex: 0 0 auto; width: 84px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; font-size: 13px; }
  .who .av { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--green); font: 800 20px Fraunces, Georgia, serif; }
  .who .nm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who small { color: var(--muted); font-weight: 400; font-size: 11px; }
  .who button.on { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
  .who button.on .av { background: var(--red); color: #fff; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 30px; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } .card { padding: 18px; } }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1b16; --card: #16261f; --ink: #eef0ea; --muted: #9aa69f; --line: #2a3b33; --soft: #1e3329; --green: #8fd1ab; }
    header { background-color: #0b2a1f; }
    input, textarea, select { background: #0f1b16; }
    .msg.mine { background: #2d6b4c; }
    .tabs button.on { color: #ff6b73; }
    button.ghost { color: var(--green); }
  }
</style>
</head>
<body>
<header>
  <a class="acct" id="acct" href="#account">Log in</a>
  <h1><a href="/">Secret Santa</a></h1>
  <p id="sub">Draw names, share wish lists, keep the secret.</p>
</header>
<main id="app"><div class="card muted">Loading…</div></main>
<footer>Links are private: anyone with a link can open it, so send each one only to its owner.</footer>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
